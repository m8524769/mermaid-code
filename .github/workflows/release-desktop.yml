name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      release-id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create Release with auto-generated notes
        id: create
        uses: actions/github-script@v8
        with:
          script: |
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Mermaid Code ${context.ref.replace('refs/tags/', '')}`,
              draft: true,
              generate_release_notes: true,
            });
            core.setOutput('id', release.id);

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - run: pnpm install

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          args: --target ${{ matrix.target }}
          uploadUpdaterSignatures: false

  update-tap:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ARM_URL="https://github.com/m8524769/mermaid-code/releases/download/v${VERSION}/Mermaid.Code_${VERSION}_aarch64.dmg"
          X64_URL="https://github.com/m8524769/mermaid-code/releases/download/v${VERSION}/Mermaid.Code_${VERSION}_x64.dmg"
          ARM_SHA=$(curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" "$ARM_URL" | shasum -a 256 | cut -d' ' -f1)
          X64_SHA=$(curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" "$X64_URL" | shasum -a 256 | cut -d' ' -f1)
          git clone https://x-access-token:${TAP_TOKEN}@github.com/m8524769/homebrew-tap.git
          cd homebrew-tap
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/mermaid-code.rb
          sed -i "s/arm:   \"[a-f0-9]*\"/arm:   \"${ARM_SHA}\"/" Casks/mermaid-code.rb
          sed -i "s/intel: \"[a-f0-9]*\"/intel: \"${X64_SHA}\"/" Casks/mermaid-code.rb
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add Casks/mermaid-code.rb
          git commit -m "Update mermaid-code to ${VERSION}"
          git push
