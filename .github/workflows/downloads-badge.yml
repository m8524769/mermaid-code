name: Downloads Badge

# Count manual installer downloads from R2 (Cloudflare edge) per UTC day, keep a
# per-day breakdown plus a cumulative total on the orphan `stats` branch, expose a
# shields endpoint JSON the README badge points at, and render two SVGs for the
# branch README to embed: a per-platform daily trend (downloads-chart.svg) and an
# all-time per-country breakdown (downloads-country.svg).
#
# Model — one record per UTC day. Complete past days are counted 00:00->00:00;
# today is counted 00:00->now and refreshes on every run. The last
# HOT_DAYS+1 days are RE-counted each run and overwritten, so sampling noise
# self-heals and same-day re-runs converge. A day freezes once it ages past that
# window (it can no longer be queried, so its last count sticks). State:
# {total, totalUpdateChecks, updatedAt,
#  days:[{date, count, updateChecks,
#         byPlatform:{macOS,Windows,Linux}, byCountry:{CC:n,...}}]};
# total = sum(days[].count), totalUpdateChecks = sum(days[].updateChecks). The
# last day (date == today, UTC) is thus a partial 00:00->now count.
#
# `byPlatform` splits the day's `count` into macOS (.dmg) / Windows (.msi,.exe) /
# Linux (.deb,.AppImage,.rpm); `byCountry` splits the same `count` by client
# country (ISO code, "XX" if unknown), so download-stats.mjs can draw per-platform
# and per-country daily trends. Both are derived from the same query (the country
# dimension makes the sampled dataset finer, hence slightly noisier at low
# volume); absent buckets are omitted, and days recorded before these fields were
# added carry neither (drawn as ungrouped).
#
# `count` = manual installer downloads (/latest/* files); `updateChecks` = Tauri
# auto-updater hits on the manifest /latest.json (root path, distinct from the
# /latest/ installer dir). Both come from the SAME query (host+GET+200, no path
# filter) and are split apart in jq. Caveat: only the R2 endpoint is counted (the
# github.com fallback endpoint is a different zone), and if the updater ever sends
# conditional requests, 304s aren't counted (query is 200-only, same as downloads).
#
# Cloudflare Free plan keeps the sampled httpRequestsAdaptiveGroups dataset for
# only ~8 days and caps a query at a 1-day span, so we can't backfill — HOT_DAYS
# stays under retention and we run daily so every day is recomputed several times
# while still queryable before it freezes.
#
# Bootstrap: the `stats` branch already exists from a previous schema; the first
# run of this version resets it to {total:0,totalUpdateChecks:0,updatedAt:null,days:[]}
# (old totals are intentionally discarded — there is no per-day history to carry
# over) and starts counting the trailing HOT_DAYS+1 days. Requires the CF_API_TOKEN
# repo secret (Zone Analytics:Read; CF_ZONE_ID is passed plaintext).

on:
  schedule:
    - cron: '17 3 * * *' # daily 03:17 UTC (off the hour to dodge GitHub's cron congestion)
  workflow_dispatch:

permissions:
  contents: write # push the updated JSON back to the `stats` branch

concurrency:
  group: downloads-badge
  cancel-in-progress: false # never interrupt a run mid-push (non-fast-forward)

jobs:
  update-badge:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: 8bbd475ab24d00c599bc3dd02a28d6a2 # zone id is not secret
      R2_HOST: releases.mermaid-code.com
    steps:
      # Check out the state branch as the working tree. persist-credentials
      # (default true) lets the final `git push` reuse GITHUB_TOKEN. The branch
      # must already exist (see bootstrap note above).
      - uses: actions/checkout@v7
        with:
          ref: stats

      - name: Count new downloads and rebuild badge
        run: |
          set -euo pipefail

          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "CF_API_TOKEN is empty — add it as a repo secret." >&2
            exit 1
          fi

          # ---- Reset any pre-per-day schema on first run ---------------------
          # Earlier schemas ({total,lastCounted,history} or the baseline variant)
          # carried no usable per-day history, so their totals are discarded and
          # we start fresh. Detected by the absence of a `days` array.
          if [ "$(jq 'has("days")' downloads.json)" = "false" ]; then
            echo '{"total":0,"totalUpdateChecks":0,"updatedAt":null,"days":[]}' > downloads.json
            echo "Initialized fresh per-day state (old totals discarded)."
          fi

          # ---- Decide which UTC days to (re)count -----------------------------
          # Recompute today + the previous HOT_DAYS days, all inside CF retention.
          # Older days are already frozen in `days`.
          HOT_DAYS=6
          now_ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          today=$(date -u +%Y-%m-%d)
          countStart=$(date -u -d "$today -$HOT_DAYS days" +%Y-%m-%d)
          echo "Recompute range: $countStart .. $today"

          query='query($zoneTag:String!,$since:Time!,$until:Time!){viewer{zones(filter:{zoneTag:$zoneTag}){httpRequestsAdaptiveGroups(limit:1000,orderBy:[count_DESC],filter:{datetime_geq:$since,datetime_lt:$until,clientRequestHTTPHost:"'"$R2_HOST"'",clientRequestHTTPMethodName:"GET",edgeResponseStatus_in:[200]}){count avg{sampleInterval} dimensions{clientRequestPath clientCountryName}}}}}'

          # Days older than the recompute range stay frozen exactly as stored.
          frozen=$(jq -c --arg cs "$countStart" '[(.days // [])[] | select(.date < $cs)]' downloads.json)

          # ---- Recount each UTC day in the hot range --------------------------
          # Complete day: [D 00:00, D+1 00:00). Today: [D 00:00, now) (partial).
          # The adaptive dataset is sampled (true = count*sampleInterval); one
          # query is capped at a 1-day span, which each per-day window respects.
          recomputed='[]'
          ok=0
          fail=0
          d="$countStart"
          while [[ ! "$d" > "$today" ]]; do
            next=$(date -u -d "$d +1 day" +%Y-%m-%d)
            s_iso="${d}T00:00:00Z"
            if [ "$d" = "$today" ]; then
              e_iso="$now_ts"
            else
              e_iso="${next}T00:00:00Z"
            fi

            body=$(jq -n --arg q "$query" --arg zt "$CF_ZONE_ID" --arg si "$s_iso" --arg ui "$e_iso" \
              '{query:$q, variables:{zoneTag:$zt, since:$si, until:$ui}}')
            resp=$(curl -sS -X POST https://api.cloudflare.com/client/v4/graphql \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$body")

            if [ "$(echo "$resp" | jq '.errors // [] | length')" != "0" ]; then
              # Keep the previously stored count for this day instead of dropping
              # it to 0 (a transient/aged-out query must not erase real downloads).
              prev=$(jq -r --arg d "$d" '(.days // []) | map(select(.date==$d)) | .[0].count // empty' downloads.json)
              prevck=$(jq -r --arg d "$d" '(.days // []) | map(select(.date==$d)) | .[0].updateChecks // 0' downloads.json)
              prevbp=$(jq -c --arg d "$d" '(.days // []) | map(select(.date==$d)) | .[0].byPlatform // {}' downloads.json)
              prevbc=$(jq -c --arg d "$d" '(.days // []) | map(select(.date==$d)) | .[0].byCountry // {}' downloads.json)
              echo "  $d query failed: $(echo "$resp" | jq -r '[.errors[].message] | join("; ")')${prev:+ (keeping $prev)}" >&2
              fail=$(( fail + 1 ))
              if [ -n "$prev" ]; then
                recomputed=$(echo "$recomputed" | jq --arg d "$d" --argjson c "$prev" --argjson ck "$prevck" --argjson bp "$prevbp" --argjson bc "$prevbc" '. + [{date:$d, count:$c, updateChecks:$ck, byPlatform:$bp, byCountry:$bc}]')
              fi
              d="$next"
              continue
            fi

            # Manual installer downloads = /latest/* minus the updater manifest
            # (latest.json), macOS self-update payload (.app.tar.gz) and sigs.
            # GET-only (see filter) drops HEAD probes. Round per group to match
            # the reference download-stats.mjs.
            c=$(echo "$resp" | jq '
              [ .data.viewer.zones[0].httpRequestsAdaptiveGroups[]
                | select(.dimensions.clientRequestPath | startswith("/latest/"))
                | (.dimensions.clientRequestPath | sub(".*/"; "")) as $n
                | select($n | test("^latest\\.json$|\\.sig$|\\.app\\.tar\\.gz$") | not)
                | (.count * (.avg.sampleInterval // 1) | round)
              ] | add // 0')
            # Split the same /latest/* installers by platform (subset of $c);
            # unknown extensions are dropped, so byPlatform sums to <= count.
            bp=$(echo "$resp" | jq -c '
              [ .data.viewer.zones[0].httpRequestsAdaptiveGroups[]
                | (.dimensions.clientRequestPath) as $p
                | select($p | startswith("/latest/"))
                | ($p | sub(".*/"; "")) as $n
                | (.count * (.avg.sampleInterval // 1) | round) as $v
                | (if   $n | test("\\.dmg$"; "i")               then "macOS"
                   elif $n | test("\\.(msi|exe)$"; "i")         then "Windows"
                   elif $n | test("\\.(deb|appimage|rpm)$"; "i") then "Linux"
                   else empty end) as $plat
                | {plat:$plat, v:$v}
              ] | reduce .[] as $x ({}; .[$x.plat] += $x.v)')
            # Same /latest/* installers grouped by client country (same caliber
            # as $c, so byCountry sums to count). "XX" for unknown geo.
            bc=$(echo "$resp" | jq -c '
              [ .data.viewer.zones[0].httpRequestsAdaptiveGroups[]
                | (.dimensions.clientRequestPath) as $p
                | select($p | startswith("/latest/"))
                | ($p | sub(".*/"; "")) as $n
                | select($n | test("^latest\\.json$|\\.sig$|\\.app\\.tar\\.gz$") | not)
                | { c: (.dimensions.clientCountryName // "XX"),
                    v: (.count * (.avg.sampleInterval // 1) | round) }
              ] | reduce .[] as $x ({}; .[$x.c] += $x.v)')
            # Update checks = auto-updater hits on the root manifest /latest.json
            # (not under /latest/, so disjoint from the download count above).
            ck=$(echo "$resp" | jq '
              [ .data.viewer.zones[0].httpRequestsAdaptiveGroups[]
                | select(.dimensions.clientRequestPath == "/latest.json")
                | (.count * (.avg.sampleInterval // 1) | round)
              ] | add // 0')
            bp_str=$(echo "$bp" | jq -r 'to_entries | map("\(.key):\(.value)") | join(" ")')
            [ "$d" = "$today" ] && echo "  $d: $c dl / $ck checks${bp_str:+ [$bp_str]} ($(echo "$bc" | jq 'length') countries) (partial 00:00->now)" || echo "  $d: $c dl / $ck checks${bp_str:+ [$bp_str]} ($(echo "$bc" | jq 'length') countries)"
            recomputed=$(echo "$recomputed" | jq --arg d "$d" --argjson c "$c" --argjson ck "$ck" --argjson bp "$bp" --argjson bc "$bc" '. + [{date:$d, count:$c, updateChecks:$ck, byPlatform:$bp, byCountry:$bc}]')
            ok=$(( ok + 1 ))
            d="$next"
          done

          if [ "$ok" -eq 0 ] && [ "$fail" -gt 0 ]; then
            echo "All day queries failed — likely a token/zone error. Aborting." >&2
            exit 1
          fi

          # ---- Assemble state: frozen + recomputed days; totals = Σ each -----
          days=$(jq -cn --argjson f "$frozen" --argjson r "$recomputed" '$f + $r')
          total=$(jq -n --argjson days "$days" '[$days[].count] | add // 0')
          totalUpdateChecks=$(jq -n --argjson days "$days" '[$days[].updateChecks // 0] | add // 0')
          echo "cumulative total=$total updateChecks=$totalUpdateChecks"

          jq -n \
            --argjson total "$total" \
            --argjson checks "$totalUpdateChecks" \
            --arg now "$now_ts" \
            --argjson days "$days" \
            '{total:$total, totalUpdateChecks:$checks, updatedAt:$now, days:$days}' \
            > downloads.json.tmp && mv downloads.json.tmp downloads.json

          # shields endpoint schema; message gets thousands separators.
          msg=$(printf '%d' "$total" | sed -e ':a' -e 's/\([0-9]\+\)\([0-9]\{3\}\)/\1,\2/;ta')
          jq -n --arg msg "$msg" \
            '{schemaVersion:1, label:"downloads", message:$msg, color:"brightgreen", cacheSeconds:3600}' \
            > downloads-badge.json

      - name: Render downloads charts (SVG)
        run: |
          set -euo pipefail
          # Build Vega-Lite specs straight from downloads.json (piped, no spec
          # file) and render them to standalone SVGs with Vega's SVG renderer —
          # pure JS, so no node-canvas / system libs are needed (unlike PNG).
          # The README on this branch embeds these. Each render is non-fatal: a
          # transient npm/network failure must not block the data/badge commit,
          # so on failure we warn and keep the previously committed SVG.
          #
          # (1) downloads-chart.svg — stacked bars per UTC day split by platform;
          # an "Other" bucket carries any count not attributed to a platform (e.g.
          # days recorded before byPlatform existed), so each bar's height equals
          # that day's `count`.
          # Zero-download days: keep interior ones as gaps (a placeholder row with
          # downloads 0 preserves their x-axis slot so the timeline stays truthful
          # instead of silently collapsing), but drop the trailing day when it is
          # still 0 — that is an incomplete "today" whose zero is not-yet-counted,
          # not a real zero, and would otherwise sit as a fake empty slot at the
          # right edge on every first run of a UTC day.
          plat=$(jq -c '
            (.days | (map(.date) | max)) as $last
            | [ .days[] | select(.date != $last or .count > 0) ] as $days
            | [ $days[] | .date as $d | (.byPlatform // {}) | to_entries[]
                | {date:$d, platform:.key, downloads:.value} ]
            + [ $days[]
                | {date:.date, platform:"Other",
                   downloads:(.count - ((.byPlatform // {} | [.[]] | add) // 0))}
                | select(.downloads > 0) ]
            + [ $days[] | select(.count == 0)
                | {date:.date, platform:"Other", downloads:0} ]
          ' downloads.json)
          spec=$(jq -n --argjson plat "$plat" '{
            "$schema":"https://vega.github.io/schema/vega-lite/v6.json",
            background:"white", width:700, height:320, padding:12,
            title:{text:"Mermaid Code — daily downloads by platform", anchor:"start",
                   fontSize:15, fontWeight:600,
                   subtitle:"manual installer downloads from the release CDN, per UTC day",
                   subtitleFontSize:11, subtitleColor:"#888", offset:12},
            data:{values:$plat},
            mark:{type:"bar", cornerRadiusEnd:3},
            encoding:{
              x:{field:"date", type:"ordinal", title:null,
                 axis:{labelExpr:"substring(datum.value, 5)", labelAngle:0, labelOverlap:true,
                       labelColor:"#666", tickColor:"#ddd", domainColor:"#ddd"}},
              y:{field:"downloads", type:"quantitative", aggregate:"sum", title:"Downloads",
                 axis:{grid:true, gridColor:"#eee", tickMinStep:1, domain:false, ticks:false,
                       labelColor:"#666", titleColor:"#666"}},
              color:{field:"platform", type:"nominal",
                     scale:{domain:["macOS","Windows","Linux","Other"],
                            range:["#3ecf8e","#5b8def","#f0a13b","#c4c4c4"]},
                     legend:{title:null, orient:"top", labelColor:"#444", symbolType:"square"}}
            },
            config:{view:{stroke:null}, scale:{bandPaddingInner:0.35}}
          }')
          echo "$spec" | npx -y -p vega-lite@6.4.3 -p vega@6.4.0 vl2svg > downloads-chart.svg.tmp \
            && mv downloads-chart.svg.tmp downloads-chart.svg \
            && echo "Rendered downloads-chart.svg ($(wc -c < downloads-chart.svg) bytes)" \
            || { echo "::warning::chart render failed — keeping previous downloads-chart.svg"; rm -f downloads-chart.svg.tmp; }

          # (2) downloads-country.svg — all-time downloads per client country.
          # Aggregate byCountry across every day, keep the top 12 and roll the long
          # tail into "Other"; horizontal bars sorted by volume. The sort is passed
          # as an explicit domain array (not sort:"-x") so the layered bar+label
          # share one domain order without Vega-Lite's union-sort warning.
          byc=$(jq -c '
            (reduce (.days[] | (.byCountry // {}) | to_entries[]) as $e ({}; .[$e.key] += $e.value))
            | to_entries | sort_by(-.value)
            | (.[0:12] | map({country:.key, downloads:.value}))
              + (.[12:] | if length>0 then [{country:"Other", downloads:(map(.value)|add)}] else [] end)
          ' downloads.json)
          corder=$(echo "$byc" | jq -c '[.[].country]')
          cmax=$(echo "$byc" | jq '[.[].downloads] | max // 0')
          cspec=$(jq -n --argjson byc "$byc" --argjson order "$corder" --argjson maxv "$cmax" '{
            "$schema":"https://vega.github.io/schema/vega-lite/v6.json",
            background:"white", width:600, height:{step:30}, padding:{left:12,right:24,top:12,bottom:12},
            title:{text:"Mermaid Code — downloads by country/region (all-time)", anchor:"start",
                   fontSize:15, fontWeight:600,
                   subtitle:"manual installer downloads from the release CDN, by client country/region",
                   subtitleFontSize:11, subtitleColor:"#888", offset:12},
            data:{values:$byc},
            encoding:{
              y:{field:"country", type:"nominal", sort:$order, title:null,
                 axis:{labelColor:"#333", labelFontSize:12.5, labelFontWeight:500, labelPadding:8,
                       domain:false, ticks:false}},
              x:{field:"downloads", type:"quantitative", title:"Downloads",
                 scale:{domain:[0, ($maxv + ($maxv / 12 | ceil))]},
                 axis:{grid:true, gridColor:"#f0f0f0", tickMinStep:1, domain:false, ticks:false,
                       labelColor:"#999", titleColor:"#999", titleFontSize:11, titleFontWeight:500}}
            },
            layer:[
              {mark:{type:"bar", cornerRadiusEnd:4, height:{band:0.7}},
               encoding:{color:{field:"downloads", type:"quantitative", legend:null,
                                scale:{range:["#aec5f2","#3b6fd6"]}}}},
              {mark:{type:"text", align:"left", dx:6, color:"#555", fontSize:12, fontWeight:600,
                     baseline:"middle"},
               encoding:{text:{field:"downloads", type:"quantitative"}}}
            ],
            config:{view:{stroke:null}}
          }')
          echo "$cspec" | npx -y -p vega-lite@6.4.3 -p vega@6.4.0 vl2svg > downloads-country.svg.tmp \
            && mv downloads-country.svg.tmp downloads-country.svg \
            && echo "Rendered downloads-country.svg ($(wc -c < downloads-country.svg) bytes)" \
            || { echo "::warning::country chart render failed — keeping previous downloads-country.svg"; rm -f downloads-country.svg.tmp; }

          # (3) downloads-share.svg — all-time platform share as a donut. Sum
          # byPlatform across every day plus the same "Other" residual as chart
          # (1), so the ring sums to the all-time attributed count. Percentage
          # labels are derived in-spec; slices under 4% hide their label to avoid
          # overlap. Non-fatal, same as the charts above.
          share=$(jq -c '
            ( [ .days[] | (.byPlatform // {}) | to_entries[] ]
              | group_by(.key) | map({platform:.[0].key, downloads:(map(.value)|add)}) )
            + ( ([ .days[] | (.count - ((.byPlatform // {} | [.[]] | add) // 0)) ] | add // 0)
                | if . > 0 then [{platform:"Other", downloads:.}] else [] end )
          ' downloads.json)
          sspec=$(jq -n --argjson share "$share" '{
            "$schema":"https://vega.github.io/schema/vega-lite/v6.json",
            background:"white", width:360, height:300, padding:12,
            title:{text:"Mermaid Code — platform share (all-time)", anchor:"start",
                   fontSize:15, fontWeight:600,
                   subtitle:"share of manual installer downloads by platform",
                   subtitleFontSize:11, subtitleColor:"#888", offset:12},
            data:{values:$share},
            transform:[
              {joinaggregate:[{op:"sum", field:"downloads", as:"tot"}]},
              {calculate:"datum.downloads/datum.tot", as:"frac"}
            ],
            encoding:{
              theta:{field:"downloads", type:"quantitative", stack:true},
              order:{field:"downloads", sort:"descending"},
              color:{field:"platform", type:"nominal",
                     scale:{domain:["macOS","Windows","Linux","Other"],
                            range:["#3ecf8e","#5b8def","#f0a13b","#c4c4c4"]},
                     legend:{title:null, orient:"right", labelColor:"#444", symbolType:"square"}}
            },
            layer:[
              {mark:{type:"arc", innerRadius:70, outerRadius:110, stroke:"white", strokeWidth:2}},
              {mark:{type:"text", radius:135, fontSize:11.5, fontWeight:600, fill:"#555"},
               encoding:{text:{field:"frac", type:"quantitative", format:".0%"},
                         opacity:{condition:{test:"datum.frac >= 0.04", value:1}, value:0}}}
            ],
            config:{view:{stroke:null}}
          }')
          echo "$sspec" | npx -y -p vega-lite@6.4.3 -p vega@6.4.0 vl2svg > downloads-share.svg.tmp \
            && mv downloads-share.svg.tmp downloads-share.svg \
            && echo "Rendered downloads-share.svg ($(wc -c < downloads-share.svg) bytes)" \
            || { echo "::warning::share chart render failed — keeping previous downloads-share.svg"; rm -f downloads-share.svg.tmp; }

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add downloads.json downloads-badge.json
          [ -f downloads-chart.svg ] && git add downloads-chart.svg || true
          [ -f downloads-country.svg ] && git add downloads-country.svg || true
          [ -f downloads-share.svg ] && git add downloads-share.svg || true
          if git diff --cached --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "chore(stats): update downloads badge ($(date -u +%F))"
            git push
          fi
